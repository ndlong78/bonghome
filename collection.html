<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Bộ sưu tập của Bông</title>
  <meta name="description" content="Xem sao, sticker và huy hiệu bé đã nhận trên thiết bị này.">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#FFB7C5">
  <link rel="icon" href="./favicon.ico">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <script src="./shared-ui.js" defer></script>
  <script src="./js/reward-collection.js" defer></script>
  <link rel="stylesheet" href="./css/pages/collection.css">
</head>
<body>
  <main class="bh-collection" aria-labelledby="collectionTitle">
    <div class="bh-collection__top">
      <a class="bh-collection__back" href="./index.html">← Về trang chủ</a>
    </div>
    <header class="bh-collection__profile">
      <div id="collectionAvatar" class="bh-collection__avatar" aria-hidden="true">🌸</div>
      <div>
        <h1 id="collectionTitle">Bộ sưu tập của Bông</h1>
        <p id="collectionIntro" class="bh-collection__intro">Mỗi phần thưởng là một lời khen nhẹ nhàng cho những lần bé hoàn thành trò chơi.</p>
      </div>
    </header>
    <div class="bh-collection__stars" id="collectionStars" aria-live="polite">⭐ Đang xem số sao…</div>
    <section aria-labelledby="stickerTitle">
      <h2 id="stickerTitle">Sticker</h2>
      <div class="bh-reward-grid" id="collectionStickers"></div>
    </section>
    <section aria-labelledby="badgeTitle">
      <h2 id="badgeTitle">Huy hiệu</h2>
      <div class="bh-reward-grid" id="collectionBadges"></div>
    </section>
  </main>
</body>
</html>
