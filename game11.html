<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Xếp Khối Thông Minh – Bông Home's</title>
  <meta name="description" content="Xếp Khối Thông Minh – trò chơi sắp xếp hình khối nhẹ nhàng cho bé trên Bông Home's.">
  <link rel="canonical" href="https://bong.no.id.vn/game11.html">
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#FFF7F0">
  <link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Bông Home's">
  <link rel="stylesheet" href="./css/design-tokens.css">
  <link rel="stylesheet" href="./css/game11-blocks.css">
  <script src="./shared-ui.js" defer></script>
  <script src="./js/game11-blocks.js" defer></script>
</head>
<body class="game11-page">
  <main class="game11-shell">
    <div class="game11-topbar">
      <a class="game11-home" href="./index.html" aria-label="Về trang chủ">🏠 Trang chủ</a>
      <h1 class="game11-heading">🧩 Xếp Khối Thông Minh</h1>
      <button class="game11-reset" id="blockReset" type="button" aria-label="Chơi lại từ đầu">↻ Chơi lại</button>
    </div>

    <p class="game11-intro">Chọn hoặc kéo một khối vào bàn. Khi đầy cả một hàng hoặc một cột, các ô đó sẽ được dọn đi để bé có thêm chỗ chơi.</p>

    <div class="game11-score-card" aria-label="Điểm vui hiện tại">
      ⭐ Điểm vui: <span id="blockScore">0</span>
    </div>

    <section class="block-board-wrap" aria-label="Bàn xếp khối">
      <div
        class="block-board"
        id="blockBoard"
        role="grid"
        tabindex="0"
        aria-label="Bàn xếp khối 10 hàng 10 cột. Dùng phím mũi tên để di chuyển, Enter hoặc phím cách để đặt khối."
      ></div>
    </section>

    <h2 class="block-tray-title">Chọn một khối</h2>
    <div class="block-tray" id="blockTray" role="group" aria-label="Ba khối đang có"></div>

    <div class="game11-status" id="blockStatus" role="status" aria-live="polite"></div>
    <p class="game11-tip">Không cần vội nhé — trò chơi không có đồng hồ đếm ngược và không làm mất chuỗi ngày.</p>
  </main>
</body>
</html>
