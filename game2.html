<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tìm Điểm Khác Biệt - Bông Home's</title>
<meta name="description" content="Bông Home’s – 10 trò chơi vui giúp bé luyện trí nhớ, quan sát và tư duy.">
<link rel="canonical" href="https://bong.no.id.vn/game2.html">
<meta property="og:locale" content="vi_VN">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bông Home's">
<meta property="og:title" content="Tìm Điểm Khác Biệt - Bông Home's">
<meta property="og:description" content="Bông Home’s – 10 trò chơi vui giúp bé luyện trí nhớ, quan sát và tư duy.">
<meta property="og:url" content="https://bong.no.id.vn/game2.html">
<meta property="og:image" content="https://bong.no.id.vn/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary_large_image">
<style>
  /* ===== BẢNG MÀU PASTEL CHUNG CỦA CẢ TRƯỜNG ===== */
  :root{
    --kem:  #FFF7F0;
    --hong: #FFB7C5;
    --tim:  #C9B6F5;
    --vang: #FFE0A3;
    --mint: #A8E6CF;
    --troi: #BFE3FF;
    --chu:  #6B4E71;
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

  body{
    margin:0;
    min-height:100vh;
    font-family:"Segoe UI","Nunito",Arial,sans-serif;
    color:var(--chu);
    background:var(--kem);
    background-image:
      radial-gradient(circle at 10% 6%,  rgba(201,182,245,.32), transparent 30%),
      radial-gradient(circle at 90% 10%, rgba(168,230,207,.32), transparent 32%),
      linear-gradient(180deg,#F1EEFB 0%, var(--kem) 40%);
    background-attachment:fixed;
    padding:14px 12px 40px;
    overflow-x:hidden;
    user-select:none;
  }

  .khung{ max-width:900px; margin:0 auto; }

  /* ===== THANH TRÊN ===== */
  .thanh-tren{ display:flex; align-items:center; gap:10px; }
  .nut-ve{
    display:inline-flex; align-items:center; gap:6px;
    padding:10px 16px;
    background:#fff; color:var(--chu);
    text-decoration:none;
    font-size:16px; font-weight:800;
    border:3px solid var(--tim);
    border-radius:999px;
    box-shadow:0 4px 0 rgba(0,0,0,.06);
  }
  .nut-ve:active{ transform:translateY(2px); box-shadow:none; }
  h1{
    flex:1; text-align:center;
    font-size:clamp(21px,5vw,34px);
    margin:0; color:#7A4E86;
    text-shadow:0 2px 0 #fff;
  }
  .cham{ width:52px; }
  @media (max-width:560px){ .cham{ display:none; } h1{ font-size:19px; } }

  .huong-dan{
    text-align:center;
    font-size:clamp(15px,3.4vw,19px);
    font-weight:700; color:#8D7595;
    margin:10px 0 12px;
  }

  /* ===== BẢNG SỐ LIỆU ===== */
  .bang-so{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; margin-bottom:14px; }
  .o-so{
    background:#fff;
    border:3px solid var(--mint);
    border-radius:18px;
    padding:8px 16px; min-width:104px; text-align:center;
    box-shadow:0 4px 0 rgba(0,0,0,.05);
  }
  .o-so .nhan{ font-size:12px; font-weight:700; color:#8D7595; display:block; }
  .o-so .gia-tri{ font-size:22px; font-weight:900; color:#4E9A78; }

  /* ===== HAI BỨC TRANH ===== */
  .hai-tranh{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
  }
  @media (max-width:640px){ .hai-tranh{ grid-template-columns:1fr; } }

  .tranh{
    background:#fff;
    border:5px solid var(--hong);
    border-radius:24px;
    padding:8px;
    box-shadow:0 6px 0 rgba(0,0,0,.06), 0 12px 24px rgba(150,120,170,.14);
    position:relative;
  }
  .tranh:nth-child(2){ border-color:var(--tim); }
  .nhan-tranh{
    position:absolute; top:-14px; left:16px;
    background:var(--hong); color:#fff;
    font-size:14px; font-weight:800;
    padding:4px 14px; border-radius:999px;
    border:3px solid #fff;
  }
  .tranh:nth-child(2) .nhan-tranh{ background:var(--tim); }

  .tranh svg{ width:100%; height:auto; display:block; border-radius:16px; cursor:pointer; }

  /* Vòng tròn xanh đánh dấu chỗ bé tìm đúng */
  .vong-dung{
    fill:none; stroke:#3FBF8F; stroke-width:5;
    animation:hien-vong .45s cubic-bezier(.2,1.5,.4,1);
  }
  @keyframes hien-vong{ from{ opacity:0; transform:scale(.3); transform-origin:center; } to{ opacity:1; } }

  /* Dấu X đỏ nhạt khi bé chấm sai */
  .dau-sai{
    stroke:#F09B9B; stroke-width:5; stroke-linecap:round;
    animation:tan-dan .7s ease forwards;
  }
  @keyframes tan-dan{ 0%{ opacity:1; } 100%{ opacity:0; } }

  /* Nhấp nháy khi bé bấm gợi ý */
  .goi-y{
    fill:none; stroke:#FFD166; stroke-width:6;
    animation:nhap-nhay 1.4s ease 2;
  }
  @keyframes nhap-nhay{ 0%,100%{ opacity:0; } 50%{ opacity:1; } }

  /* ===== NÚT ĐIỀU KHIỂN ===== */
  .nhom-nut-duoi{ display:flex; justify-content:center; gap:10px; margin-top:18px; flex-wrap:wrap; }
  .nhom-nut-duoi button{
    font-family:inherit;
    font-size:17px; font-weight:800;
    padding:13px 26px;
    border:none; border-radius:999px;
    cursor:pointer;
    box-shadow:0 5px 0 rgba(0,0,0,.12);
  }
  .nut-goi-y{ background:var(--vang); color:#8A6522; }
  .nut-van-moi{ background:var(--troi); color:#3E6E96; }
  .nhom-nut-duoi button:active{ transform:translateY(3px); box-shadow:none; }

  /* ===== MÀN THẮNG CUỘC ===== */
  #phaoGiay{ position:fixed; inset:0; pointer-events:none; z-index:60; display:none; }
  .man-thang{
    position:fixed; inset:0; z-index:70;
    display:none; align-items:center; justify-content:center;
    background:rgba(122,78,134,.35); padding:16px;
  }
  .man-thang.hien{ display:flex; }
  .hop-thang{
    background:#fff;
    border:6px solid var(--vang);
    border-radius:34px;
    padding:26px 24px; text-align:center;
    max-width:400px; width:100%;
    box-shadow:0 20px 50px rgba(120,80,140,.35);
    animation:bat-len .5s cubic-bezier(.2,1.4,.4,1);
  }
  @keyframes bat-len{ from{ transform:scale(.6); opacity:0; } to{ transform:scale(1); opacity:1; } }
  .hop-thang h2{ font-size:30px; margin:6px 0 4px; color:#E0729B; }
  .hop-thang .loi{ font-size:17px; font-weight:700; color:#8D7595; margin:0 0 14px; }
  .ket-qua{ display:flex; gap:10px; justify-content:center; }
  .ket-qua div{
    flex:1; background:#FFF8E7;
    border:3px solid var(--vang);
    border-radius:16px; padding:10px 6px;
  }
  .ket-qua .nhan{ font-size:12px; font-weight:700; color:#9A7B4F; display:block; }
  .ket-qua .gia-tri{ font-size:24px; font-weight:900; color:#9A6410; }
  .ky-luc-moi{
    font-size:17px; font-weight:900; color:#4E9A78;
    background:#EAFBF3; border:3px dashed var(--mint);
    border-radius:14px; padding:8px; margin:12px 0 0;
    display:none;
  }
  .ky-luc-moi.hien{ display:block; }
  .nhom-nut{ display:flex; gap:10px; margin-top:16px; }
  .nhom-nut button, .nhom-nut a{
    flex:1; font-family:inherit;
    font-size:17px; font-weight:800;
    padding:14px 10px; border:none; border-radius:999px;
    cursor:pointer; text-decoration:none;
    box-shadow:0 5px 0 rgba(0,0,0,.12);
  }
  .nut-choi-lai{ background:var(--hong); color:#fff; }
  .nhom-nut a{ background:var(--troi); color:#3E6E96; display:flex; align-items:center; justify-content:center; }
  .nhom-nut button:active, .nhom-nut a:active{ transform:translateY(3px); box-shadow:none; }

  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; } }
</style>
<script src="./shared-ui.js" defer></script>
<script src="./js/game2-engine.js" defer></script>
<script src="./js/game2-ui.js" defer></script>
</head>
<body>

<div class="khung">

  <div class="thanh-tren">
    <a class="nut-ve" href="index.html">🏠 Về nhà</a>
    <h1>Tìm Điểm Khác Biệt</h1>
    <div class="cham"></div>
  </div>

  <p class="huong-dan">Hai bức tranh có <b>5 chỗ khác nhau</b>. Bé chạm vào chỗ khác nhé!</p>

  <div class="bang-so">
    <div class="o-so"><span class="nhan">Đã tìm ra</span><span class="gia-tri" id="soTimDuoc">0/5</span></div>
    <div class="o-so"><span class="nhan">Thời gian</span><span class="gia-tri" id="dongHo">0:00</span></div>
    <div class="o-so"><span class="nhan">Kỷ lục</span><span class="gia-tri" id="kyLuc">--</span></div>
  </div>

  <div class="hai-tranh">
    <div class="tranh">
      <span class="nhan-tranh">Tranh 1</span>
      <svg id="tranhA" viewBox="0 0 300 300" role="img" aria-label="Bức tranh thứ nhất"></svg>
    </div>
    <div class="tranh">
      <span class="nhan-tranh">Tranh 2</span>
      <svg id="tranhB" viewBox="0 0 300 300" role="img" aria-label="Bức tranh thứ hai"></svg>
    </div>
  </div>

  <div class="nhom-nut-duoi">
    <button class="nut-goi-y" id="nutGoiY">💡 Gợi ý (còn 2)</button>
    <button class="nut-van-moi" id="nutVanMoi">🔄 Tranh mới</button>
  </div>
</div>

<canvas id="phaoGiay" aria-hidden="true"></canvas>

<div class="man-thang" id="manThang" role="dialog" aria-modal="true" aria-labelledby="tieuDeThang" aria-describedby="loiKhen">
  <div class="hop-thang">
    <div style="font-size:52px">🔍🎉</div>
    <h2>Mắt bé tinh quá!</h2>
    <p class="loi" id="loiKhen">Bé đã tìm đủ 5 điểm khác biệt!</p>
    <div class="ket-qua">
      <div><span class="nhan">Thời gian</span><span class="gia-tri" id="tgCuoi">0:00</span></div>
      <div><span class="nhan">Chấm sai</span><span class="gia-tri" id="saiCuoi">0</span></div>
    </div>
    <div class="ky-luc-moi" id="bangKyLuc">🏆 Kỷ lục mới của bé!</div>
    <div class="nhom-nut">
      <button class="nut-choi-lai" id="nutChoiLai">Tranh mới</button>
      <a href="index.html">Về nhà</a>
    </div>
  </div>
</div>

</body>
</html>
