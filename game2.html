<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Tìm Điểm Khác Biệt - Bông Home's</title>
<meta name="description" content="Bông Home’s – 10 trò chơi vui giúp bé luyện trí nhớ, quan sát và tư duy.">
<link rel="canonical" href="https://bong.no.id.vn/game2.html">
<meta property="og:locale" content="vi_VN">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bông Home's">
<meta property="og:title" content="Tìm Điểm Khác Biệt - Bông Home's">
<meta property="og:description" content="Bông Home’s – 10 trò chơi vui giúp bé luyện trí nhớ, quan sát và tư duy.">
<meta property="og:url" content="https://bong.no.id.vn/game2.html">
<meta property="og:image" content="https://bong.no.id.vn/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="./css/game-shell.css">
<link rel="stylesheet" href="./css/pages/game2.css">
<script src="./shared-ui.js" defer></script>
<script src="./js/game2-engine.js" defer></script>
<script src="./js/game2-ui.js" defer></script>
</head>
<body>

<div class="khung">

  <div class="thanh-tren">
    <a class="nut-ve" href="index.html">🏠 Về nhà</a>
    <h1>Tìm Điểm Khác Biệt</h1>
    <div class="cham"></div>
  </div>

  <p class="huong-dan">Hai bức tranh có <b>5 chỗ khác nhau</b>. Bé chạm vào chỗ khác nhé!</p>

  <div class="bang-so">
    <div class="o-so"><span class="nhan">Đã tìm ra</span><span class="gia-tri" id="soTimDuoc">0/5</span></div>
    <div class="o-so"><span class="nhan">Thời gian</span><span class="gia-tri" id="dongHo">0:00</span></div>
    <div class="o-so"><span class="nhan">Kỷ lục</span><span class="gia-tri" id="kyLuc">--</span></div>
  </div>

  <div class="hai-tranh">
    <div class="tranh">
      <span class="nhan-tranh">Tranh 1</span>
      <svg id="tranhA" viewBox="0 0 300 300" role="img" aria-label="Bức tranh thứ nhất"></svg>
    </div>
    <div class="tranh">
      <span class="nhan-tranh">Tranh 2</span>
      <svg id="tranhB" viewBox="0 0 300 300" role="img" aria-label="Bức tranh thứ hai"></svg>
    </div>
  </div>

  <div class="nhom-nut-duoi">
    <button class="nut-goi-y" id="nutGoiY">💡 Gợi ý (còn 2)</button>
    <button class="nut-van-moi" id="nutVanMoi">🔄 Tranh mới</button>
  </div>
</div>

<canvas id="phaoGiay" aria-hidden="true"></canvas>

<div class="man-thang" id="manThang" role="dialog" aria-modal="true" aria-labelledby="tieuDeThang" aria-describedby="loiKhen">
  <div class="hop-thang">
    <div class="bieu-tuong-thang">🔍🎉</div>
    <h2>Mắt bé tinh quá!</h2>
    <p class="loi" id="loiKhen">Bé đã tìm đủ 5 điểm khác biệt!</p>
    <div class="ket-qua">
      <div><span class="nhan">Thời gian</span><span class="gia-tri" id="tgCuoi">0:00</span></div>
      <div><span class="nhan">Chấm sai</span><span class="gia-tri" id="saiCuoi">0</span></div>
    </div>
    <div class="ky-luc-moi" id="bangKyLuc">🏆 Kỷ lục mới của bé!</div>
    <div class="nhom-nut">
      <button class="nut-choi-lai" id="nutChoiLai">Tranh mới</button>
      <a href="index.html">Về nhà</a>
    </div>
  </div>
</div>

</body>
</html>
