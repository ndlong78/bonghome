<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Lật Hình Tìm Cặp - Bông Home's</title>
<meta name="description" content="Bông Home’s – 10 trò chơi vui giúp bé luyện trí nhớ, quan sát và tư duy.">
<link rel="canonical" href="https://bong.no.id.vn/game1.html">
<meta property="og:locale" content="vi_VN">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Bông Home's">
<meta property="og:title" content="Lật Hình Tìm Cặp - Bông Home's">
<meta property="og:description" content="Bông Home’s – 10 trò chơi vui giúp bé luyện trí nhớ, quan sát và tư duy.">
<meta property="og:url" content="https://bong.no.id.vn/game1.html">
<meta property="og:image" content="https://bong.no.id.vn/icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="./css/game-shell.css">
<style>
  body{
    margin:0;
    min-height:100vh;
    font-family:"Segoe UI","Nunito",Arial,sans-serif;
    color:var(--chu);
    background:var(--kem);
    background-image:
      radial-gradient(circle at 12% 6%,  rgba(255,183,197,.35), transparent 30%),
      radial-gradient(circle at 88% 10%, rgba(201,182,245,.35), transparent 32%),
      linear-gradient(180deg,#FDF0F6 0%, var(--kem) 40%);
    background-attachment:fixed;
    padding:14px 12px 40px;
    overflow-x:hidden;
    user-select:none;
  }

  .khung{ max-width:760px; margin:0 auto; }

  /* ===== THANH TRÊN: NÚT VỀ TRƯỜNG + TIÊU ĐỀ ===== */
  .nut-ve{
    display:inline-flex; align-items:center; gap:6px;
    padding:10px 16px;
    background:#fff; color:var(--chu);
    text-decoration:none;
    font-size:16px; font-weight:800;
    border:3px solid var(--tim);
    border-radius:999px;
    box-shadow:0 4px 0 rgba(0,0,0,.06);
  }

  h1{
    flex:1;
    text-align:center;
    font-size:clamp(22px,5.2vw,34px);
    margin:0;
    color:#7A4E86;
    text-shadow:0 2px 0 #fff;
  }
   /* giữ tiêu đề luôn cân giữa */
  @media (max-width:520px){ .cham{ display:none; } h1{ font-size:20px; } }

  /* ===== CHỌN ĐỘ KHÓ ===== */
  .muc-do{ display:flex; justify-content:center; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .muc-do button{
    font-family:inherit;
    font-size:15px; font-weight:800;
    padding:9px 18px;
    border-radius:999px;
    border:3px solid var(--vang);
    background:#fff; color:#9A7B4F;
    cursor:pointer;
  }
  .muc-do button.dang-chon{ background:var(--vang); color:#7A5A2A; }

  /* ===== BẢNG THÀNH TÍCH NHỎ ===== */
  .bang-so{
    display:flex; justify-content:center; gap:10px;
    flex-wrap:wrap;
    margin-bottom:16px;
  }
  .o-so{
    background:#fff;
    border:3px solid var(--mint);
    border-radius:18px;
    padding:8px 16px;
    min-width:96px;
    text-align:center;
    box-shadow:0 4px 0 rgba(0,0,0,.05);
  }

  /* ===== LƯỚI LÁ BÀI ===== */
  .san-bai{
    display:grid;
    gap:10px;
    justify-content:center;
    perspective:1000px;
  }

  .la-bai{
    position:relative;
    aspect-ratio:3/4;
    cursor:pointer;
    transform-style:preserve-3d;
    transition:transform .45s cubic-bezier(.4,.2,.2,1);
    border:none; padding:0; background:none;
  }
  .la-bai.lat{ transform:rotateY(180deg); }

  .mat{
    position:absolute; inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    border-radius:16px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 5px 0 rgba(0,0,0,.07), 0 10px 20px rgba(150,120,170,.18);
  }
  /* Mặt úp: nền tím có ngôi sao */
  .mat-sau{
    background:var(--tim);
    border:4px solid #A98FE0;
    background-image:radial-gradient(circle at 30% 30%, rgba(255,255,255,.35) 2px, transparent 3px),
                     radial-gradient(circle at 75% 70%, rgba(255,255,255,.3) 2px, transparent 3px);
  }
  .mat-sau svg{ width:52%; height:52%; }
  /* Mặt ngửa: nền trắng, hiện hình vẽ */
  .mat-truoc{
    background:#fff;
    border:4px solid var(--hong);
    transform:rotateY(180deg);
  }
  .mat-truoc svg{ width:72%; height:72%; }

  /* Cặp đúng: sáng lên rồi đứng yên */
  .la-bai.dung .mat-truoc{
    border-color:var(--mint);
    background:#EAFBF3;
    animation:reo-vui .55s ease;
  }
  .la-bai.dung{ cursor:default; }
  @keyframes reo-vui{
    0%,100%{ transform:rotateY(180deg) scale(1); }
    45%    { transform:rotateY(180deg) scale(1.12); }
  }
  /* Cặp sai: lắc nhẹ */
  .la-bai.sai .mat-truoc{ border-color:#F5A9A9; background:#FFF0F0; }
  .la-bai.sai{ animation:lac-nhe .4s ease; }
  @keyframes lac-nhe{
    0%,100%{ transform:rotateY(180deg) translateX(0); }
    25%    { transform:rotateY(180deg) translateX(-6px); }
    75%    { transform:rotateY(180deg) translateX(6px); }
  }

  .la-bai:focus-visible{ outline:5px solid #7A4E86; outline-offset:4px; border-radius:20px; }

  /* ===== MÀN THẮNG CUỘC ===== */

  .ket-qua{
    display:flex; gap:10px; justify-content:center; margin-bottom:8px;
  }
  .ky-luc-moi{
    font-size:17px; font-weight:900; color:#4E9A78;
    background:#EAFBF3; border:3px dashed var(--mint);
    border-radius:14px; padding:8px; margin:12px 0 4px;
    display:none;
  }

  .nhom-nut button, .nhom-nut a{
    flex:1;
    font-family:inherit;
    font-size:17px; font-weight:800;
    padding:14px 10px;
    border-radius:999px;
    border:none;
    cursor:pointer;
    text-decoration:none;
    box-shadow:0 5px 0 rgba(0,0,0,.12);
  }

</style>
<script src="./shared-ui.js" defer></script>
<script src="./js/game1-engine.js" defer></script>
<script src="./js/game1-ui.js" defer></script>
</head>
<body>

<div class="khung">

  <div class="thanh-tren">
    <a class="nut-ve" href="index.html">🏠 Về nhà</a>
    <h1>Lật Hình Tìm Cặp</h1>
    <div class="cham"></div>
  </div>

  <p class="huong-dan">Bé lật 2 lá bài để tìm hai hình giống hệt nhau nhé!</p>

  <div class="muc-do" id="mucDo" role="group" aria-label="Chọn mức độ">
    <button data-cap="3" class="dang-chon" aria-pressed="true">Dễ · 6 lá</button>
    <button data-cap="6" aria-pressed="false">Vừa · 12 lá</button>
    <button data-cap="8" aria-pressed="false">Khó · 16 lá</button>
  </div>

  <div class="bang-so">
    <div class="o-so"><span class="nhan">Cặp tìm được</span><span class="gia-tri" id="soCap">0/3</span></div>
    <div class="o-so"><span class="nhan">Số lần lật</span><span class="gia-tri" id="soLuot">0</span></div>
    <div class="o-so"><span class="nhan">Thời gian</span><span class="gia-tri" id="dongHo">0:00</span></div>
    <div class="o-so"><span class="nhan">Kỷ lục</span><span class="gia-tri" id="kyLuc">--</span></div>
  </div>

  <div class="san-bai" id="sanBai"></div>
</div>

<!-- Pháo giấy phủ toàn màn hình khi bé thắng -->
<canvas id="phaoGiay" aria-hidden="true"></canvas>

<!-- Bảng thành tích khi hoàn thành -->
<div class="man-thang" id="manThang" role="dialog" aria-modal="true" aria-labelledby="tieuDeThang" aria-describedby="loiKhen">
  <div class="hop-thang">
    <div style="font-size:52px">🎉</div>
    <h2 id="tieuDeThang">Bé giỏi quá!</h2>
    <p class="loi" id="loiKhen">Bé đã tìm hết các cặp hình rồi!</p>
    <div class="ket-qua">
      <div><span class="nhan">Thời gian</span><span class="gia-tri" id="tgCuoi">0:00</span></div>
      <div><span class="nhan">Số lần lật</span><span class="gia-tri" id="luotCuoi">0</span></div>
    </div>
    <div class="ky-luc-moi" id="bangKyLuc">🏆 Kỷ lục mới của bé!</div>
    <div class="nhom-nut">
      <button class="nut-choi-lai" id="nutChoiLai">Chơi lại</button>
      <a href="index.html">Về nhà</a>
    </div>
  </div>
</div>
</body>
</html>
