name: Production Deployment Smoke

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Deployment origin to verify
        required: true
        default: https://bong.no.id.vn
        type: string
      expected_version:
        description: 'PHIEN_BAN mong đợi của sw.js ("local" = lấy từ sw.js của ref đang chạy, "skip" = chỉ ghi log)'
        required: false
        default: local
        type: string

permissions:
  contents: read

concurrency:
  group: deployment-smoke-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    name: Verify deployed website
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deployment smoke test
        env:
          DEPLOYMENT_URL: ${{ inputs.base_url }}
          EXPECTED_SW_VERSION: ${{ inputs.expected_version }}
        run: node scripts/verify-deployment.mjs "$DEPLOYMENT_URL"
